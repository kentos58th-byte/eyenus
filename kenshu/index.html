<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KenMaP研修・学習会設計支援ツール</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/*
VOICE: 明るく前向き。研修づくりを「やらされ」ではなく「ワクワクする準備」にする
IDEA: 旅のしおり・すごろく。ねらい→デザイン→本番→ふりかえりを進む道のり
PICTURE: 色つきの時間軸レール（活動ごとに色が変わる）と、進む道のりのステップ
COLOUR and TYPE: 深い青緑を土台に、コーラル・ひまわり・空色・ミントの差し色。丸ゴシック
LAYOUT: 上に道のり、下に作業面。スマホでは1列に積む
*/
:root{
  --teal:#1F6F72; --teal-d:#14504F; --teal-soft:#E3F1F0;
  --coral:#FF7A59; --coral-soft:#FFE8E1; --sun:#FFC845; --sun-soft:#FFF4D6;
  --sky:#4FB3E8; --sky-soft:#E1F2FC; --mint:#4CC29E; --mint-soft:#DFF5EE; --grape:#8C7AE6; --grape-soft:#ECE8FC;
  --ink:#1E2A32; --muted:#55636B; --line:#E6E3DA; --bg:#FAF9F5; --card:#FFFFFF; --danger:#C2412B;
}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;font-size:16px;line-height:1.7;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--teal)}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
/* ---- ヘッダー ---- */
.hero{background:var(--teal);color:#fff;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle at 12% 30%,rgba(255,200,69,.55) 0 7px,transparent 8px),radial-gradient(circle at 88% 25%,rgba(255,122,89,.6) 0 10px,transparent 11px),radial-gradient(circle at 70% 85%,rgba(79,179,232,.55) 0 6px,transparent 7px),radial-gradient(circle at 30% 90%,rgba(76,194,158,.6) 0 9px,transparent 10px),radial-gradient(rgba(255,255,255,.09) 1.5px,transparent 2px);background-size:auto,auto,auto,auto,22px 22px;pointer-events:none}
.hero .wrap{position:relative;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding-top:16px;padding-bottom:16px}
.brand{font-weight:900;font-size:22px;letter-spacing:.02em}
.brand b{color:var(--sun)}
.brand small{font-size:13px;font-weight:700;opacity:.9;margin-left:8px}
.mode{font-size:12.5px;font-weight:700;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.16)}
/* ---- 道のり（ステップ） ---- */
.road{background:var(--card);border-bottom:1px solid var(--line)}
.road ol{list-style:none;margin:0 auto;padding:14px 16px;max-width:1120px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;position:relative}
.road li{position:relative}
.road button{width:100%;display:flex;align-items:center;gap:10px;border:2px solid var(--line);background:#fff;border-radius:18px;padding:8px 12px;min-height:56px;cursor:pointer;text-align:left;transition:transform .15s}
.road button:hover{transform:translateY(-2px)}
.road .num{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:900;background:var(--bg);color:var(--muted)}
.road .lbl{font-weight:900;font-size:15px;line-height:1.25}
.road .lbl small{display:block;font-weight:500;font-size:11.5px;color:var(--muted)}
.road button[aria-current="step"]{border-color:var(--teal);background:var(--teal-soft)}
.road button[aria-current="step"] .num{background:var(--teal);color:#fff}
.road li:nth-child(1) .num{box-shadow:0 0 0 3px var(--sun-soft)} .road li:nth-child(2) .num{box-shadow:0 0 0 3px var(--coral-soft)} .road li:nth-child(3) .num{box-shadow:0 0 0 3px var(--sky-soft)} .road li:nth-child(4) .num{box-shadow:0 0 0 3px var(--mint-soft)}
@media(max-width:640px){.road ol{grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:10px 8px}.road button{flex-direction:column;gap:2px;padding:6px 2px;text-align:center;border-radius:14px}.road .lbl small{display:none}.road .lbl{font-size:12.5px}}
main{padding:20px 0 64px}
/* ---- カード・見出し ---- */
.card{background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:22px;margin-bottom:16px}
#view.anim .card{animation:pop .35s ease both}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.kicker{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:900;padding:3px 12px;border-radius:999px;background:var(--sun-soft);color:#7A5600;margin-bottom:6px}
h1{font-size:clamp(24px,3.4vw,34px);line-height:1.3;margin:0 0 6px;font-weight:900;text-wrap:balance}
h2{font-size:21px;margin:0 0 4px;font-weight:900}
h3{font-size:17px;margin:0 0 6px;font-weight:900}
.lead{color:var(--muted);margin:0 0 16px;font-size:14.5px}
label.f{display:block;font-weight:900;font-size:14.5px;margin:16px 0 4px}
.hint{display:block;font-weight:500;color:var(--muted);font-size:13px}
input[type=text],input[type=date],input[type=number],input[type=password],select,textarea{width:100%;border:2px solid var(--line);border-radius:14px;padding:10px 14px;background:#fff;min-height:46px;font-size:16px}
textarea{min-height:88px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 4px var(--teal-soft)}
button:focus-visible,a:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:0 16px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spacer{flex:1}
/* ---- ボタン ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:999px;border:0;background:var(--teal);color:#fff;font-weight:900;cursor:pointer;text-decoration:none;box-shadow:0 4px 0 var(--teal-d);transition:transform .08s,box-shadow .08s;font-size:15.5px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--teal-d)}
.btn.sun{background:var(--sun);color:#3D2B00;box-shadow:0 4px 0 #D9A21E}
.btn.sun:active{box-shadow:0 1px 0 #D9A21E}
.btn.sub{background:#fff;color:var(--teal);border:2px solid var(--teal);box-shadow:0 3px 0 var(--teal-soft)}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.danger{background:#fff;color:var(--danger);border:2px solid #F0C9C0;box-shadow:none}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px}
.btn.xs{min-height:36px;padding:0 10px;font-size:13px;box-shadow:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon{width:18px;height:18px;flex:none}
/* ---- チップ（指導法） ---- */
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.chip{position:relative;display:flex;gap:10px;align-items:flex-start;border:2px solid var(--line);border-radius:18px;padding:12px 14px;cursor:pointer;background:#fff;transition:transform .12s,border-color .12s}
.chip:hover{transform:translateY(-2px)}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip .dot{flex:none;width:36px;height:36px;border-radius:12px;display:grid;place-items:center}
.chip .t{font-weight:900;line-height:1.35}
.chip .d{font-size:12.5px;color:var(--muted);line-height:1.5}
.chip .check{position:absolute;top:8px;right:10px;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;background:#fff}
.chip:has(input:checked){border-color:var(--teal);background:var(--teal-soft)}
.chip:has(input:checked) .check{background:var(--teal);border-color:var(--teal)}
.chip:has(input:checked) .check::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.chip:has(input:focus-visible){outline:3px solid var(--sky);outline-offset:2px}
/* ---- 時間軸 ---- */
.sub-nav{display:flex;gap:6px;overflow-x:auto;padding:4px;background:#fff;border:1.5px solid var(--line);border-radius:999px;margin-bottom:16px}
.sub-nav button{flex:1 0 auto;border:0;background:none;border-radius:999px;padding:8px 14px;min-height:44px;font-weight:900;color:var(--muted);cursor:pointer;white-space:nowrap}
.sub-nav button[aria-current="page"]{background:var(--coral);color:#fff}
.timebar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.timebar .track{flex:1 1 220px;height:16px;border-radius:999px;background:#EEECE5;overflow:hidden;display:flex}
.timebar .seg{height:100%}
.timebar .lab{font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap}
.over{color:var(--danger)}
.tl{position:relative;padding-left:0}
.blk{display:grid;grid-template-columns:76px 1fr;gap:0;margin-bottom:12px}
.blk .rail{position:relative;display:flex;flex-direction:column;align-items:center;padding-top:14px}
.blk .rail .time{font-weight:900;font-size:15px;font-variant-numeric:tabular-nums}
.blk .rail .dur{font-size:12px;color:var(--muted)}
.blk .rail::after{content:"";position:absolute;top:62px;bottom:-12px;width:6px;border-radius:3px;background:var(--c,var(--teal));opacity:.35}
.blk:last-child .rail::after{display:none}
.blk .body{background:#fff;border:2px solid var(--line);border-left:8px solid var(--c,var(--teal));border-radius:18px;padding:14px 16px}
.blk.now .body{border-color:var(--c,var(--teal));box-shadow:0 0 0 4px var(--sun-soft)}
.blk.done .body{opacity:.6}
.blk-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tag{display:inline-flex;align-items:center;font-size:12px;font-weight:900;padding:2px 10px;border-radius:999px;background:var(--bg);color:var(--ink)}
.tag.tg{background:var(--sky-soft);color:#0F5A80}
.tag.live{background:var(--coral);color:#fff}
.tag.rec{background:var(--sun-soft);color:#7A5600}
.minbox{display:flex;align-items:center;gap:4px}
.minbox input{width:64px;text-align:center;padding:6px;min-height:40px}
.minbox button{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);background:#fff;font-weight:900;cursor:pointer}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 12px}
.meta{font-size:13.5px;color:var(--muted);margin-top:6px;display:grid;gap:2px}
.meta b{color:var(--ink)}
.addbar{border:2px dashed #D6D2C6;border-radius:18px;padding:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-left:76px}
@media(max-width:600px){.blk{grid-template-columns:56px 1fr}.addbar{margin-left:0}}
/* ---- ツール ---- */
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.tool{border:2px solid var(--line);border-radius:20px;padding:16px;background:#fff;display:flex;flex-direction:column;gap:8px}
.tool .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center}
.tool .nm{font-weight:900;font-size:16.5px}
.tool .ds{font-size:13px;color:var(--muted);flex:1}
.item{border:2px solid var(--line);border-radius:18px;padding:14px 16px;background:#fff;margin-bottom:10px}
.item.active{border-color:var(--coral);box-shadow:0 0 0 4px var(--coral-soft)}
/* ---- 結果表示 ---- */
.bars{display:flex;flex-direction:column;gap:8px}
.bar-row{display:grid;grid-template-columns:minmax(80px,30%) minmax(0,1fr) 92px;gap:8px;align-items:center;font-size:14.5px}
.bar-track{background:#EEECE5;border-radius:999px;height:24px;overflow:hidden}
.bar-fill{height:100%;border-radius:999px;transition:width .5s;background:var(--teal)}
.bar-row:nth-child(4n+2) .bar-fill{background:var(--coral)} .bar-row:nth-child(4n+3) .bar-fill{background:var(--sky)} .bar-row:nth-child(4n+4) .bar-fill{background:var(--mint)}
.bar-fill.correct{background:var(--mint)!important}
.bar-num{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.cloud{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;justify-content:center;padding:12px}
.cloud span{font-weight:900;line-height:1.2;color:var(--teal)}
.cloud span:nth-child(4n+2){color:var(--coral)} .cloud span:nth-child(4n+3){color:#2C8FC4} .cloud span:nth-child(4n){color:#7A5600}
.posts{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.post{background:var(--sun-soft);border-radius:16px;padding:12px 14px;font-size:14.5px;white-space:pre-wrap;word-break:break-word;transform:rotate(-.4deg)}
.post:nth-child(even){background:var(--sky-soft);transform:rotate(.5deg)}
.post:nth-child(3n){background:var(--mint-soft)}
.big-num{font-size:36px;font-weight:900;color:var(--teal);line-height:1.2}
.muted{color:var(--muted)} .small{font-size:13.5px}
.empty{color:var(--muted);text-align:center;padding:22px 8px;font-size:14.5px}
.split{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.split > .main{flex:999 1 540px}
.split > .side{flex:1 1 300px}
.qr{background:#fff;border:2px solid var(--line);border-radius:18px;padding:12px;text-align:center}
.qr svg{width:170px;height:170px}
.code{font-size:30px;font-weight:900;letter-spacing:.14em;color:var(--teal)}
.url{font-size:12px;word-break:break-all;color:var(--muted)}
.timer{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--ink);color:#fff;border-radius:20px;padding:14px 18px;margin-bottom:14px}
.timer .clock{font-size:34px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.timer .clock.over{color:#FF9C85}
.timer .what{font-weight:900}
.timer .btn.sub{background:transparent;color:#fff;border-color:rgba(255,255,255,.5);box-shadow:none}
/* ---- 受講者 ---- */
.choice{display:flex;align-items:center;gap:12px;border:2px solid var(--line);border-radius:16px;padding:12px 16px;margin-bottom:8px;min-height:54px;cursor:pointer;background:#fff;font-weight:700}
.choice input{width:22px;height:22px;accent-color:var(--teal)}
.choice:has(input:checked){border-color:var(--teal);background:var(--teal-soft)}
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.scale label{position:relative;display:grid;place-items:center;border:2px solid var(--line);border-radius:14px;min-height:56px;cursor:pointer;background:#fff;font-weight:900;font-size:18px}
.scale input{position:absolute;opacity:0;pointer-events:none}
.scale label:has(input:checked){border-color:var(--teal);background:var(--teal);color:#fff}
.scale label:has(input:focus-visible){outline:3px solid var(--sky)}
.scale-ends{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:4px}
.warn{font-size:13px;color:#6E4A00;background:var(--sun-soft);border-radius:12px;padding:8px 12px;margin:8px 0}
.participant{max-width:560px;margin:0 auto;padding:0 16px 48px}
.p-top{background:var(--teal);color:#fff;text-align:center;padding:18px 16px 26px;border-radius:0 0 28px 28px;margin-bottom:-10px;position:relative;overflow:hidden}
.p-top::before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle at 10% 40%,rgba(255,200,69,.6) 0 6px,transparent 7px),radial-gradient(circle at 90% 30%,rgba(255,122,89,.6) 0 8px,transparent 9px);pointer-events:none}
.p-title{font-weight:900;font-size:20px;position:relative}
.wait{display:grid;place-items:center;gap:10px;text-align:center;padding:34px 16px;color:var(--muted)}
.wait .bub{display:flex;gap:8px}
.wait .bub i{width:12px;height:12px;border-radius:50%;background:var(--coral);animation:bob 1s infinite ease-in-out}
.wait .bub i:nth-child(2){background:var(--sun);animation-delay:.15s}.wait .bub i:nth-child(3){background:var(--sky);animation-delay:.3s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.thanks{text-align:center;padding:26px 12px}
.thanks .ok{width:64px;height:64px;border-radius:50%;background:var(--mint);display:grid;place-items:center;margin:0 auto 10px;animation:pop .35s ease both}
/* ---- 投影 ---- */
.screen{min-height:100vh;display:flex;flex-direction:column;padding:28px 40px;gap:22px;background:var(--bg)}
.screen-head{display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:space-between}
.screen-title{font-size:clamp(22px,2.6vw,36px);font-weight:900;color:var(--teal)}
.screen-q{font-size:clamp(28px,4vw,54px);font-weight:900;line-height:1.35}
.screen .bar-row{font-size:clamp(16px,1.8vw,26px);grid-template-columns:minmax(120px,30%) minmax(0,1fr) 120px}
.screen .bar-track{height:clamp(26px,3vw,46px)}
.screen .post{font-size:clamp(15px,1.5vw,21px)}
.screen-join{display:flex;align-items:center;gap:16px;background:#fff;border:2px solid var(--line);border-radius:20px;padding:12px 16px}
.screen-join svg{width:120px;height:120px}
/* ---- その他 ---- */
.notice{background:var(--sky-soft);border-radius:18px;padding:14px 16px;font-size:14.5px}
.carry{background:var(--sun-soft);border-radius:18px;padding:14px 16px;margin-bottom:16px}
.status{display:flex;gap:14px;align-items:center;background:var(--mint-soft);border-radius:18px;padding:16px}
.status .st-ic{flex:none;width:52px;height:52px;border-radius:16px;background:#fff;display:grid;place-items:center}
.demo-panel{border:2.5px dashed #E9C98A;border-radius:22px;padding:14px;background:#FFFCF3}
.modal{position:fixed;inset:0;background:rgba(30,42,50,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:60}
.modal-box{background:#fff;border-radius:24px;padding:22px;max-width:560px;width:100%;max-height:88vh;overflow:auto;animation:pop .25s ease both}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 20px;border-radius:999px;font-size:14.5px;font-weight:700;z-index:70;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.guide dt{font-weight:900;margin-top:12px}
.guide dd{margin:2px 0 0}
pre.copy{white-space:pre-wrap;background:var(--bg);border-radius:14px;padding:12px;font-size:13px;max-height:320px;overflow:auto;font-family:inherit}
.future{background:var(--grape-soft);border-radius:18px;padding:14px 16px;font-size:14px}
fieldset{border:0;padding:0;margin:0 0 18px}
legend{font-weight:900;margin-bottom:6px;padding:0}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
footer.foot{text-align:center;padding:24px 16px;color:var(--muted);font-size:13px}
footer.foot button{background:none;border:0;color:var(--teal);text-decoration:underline;cursor:pointer;min-height:44px}
@media(max-width:600px){.card{padding:16px;border-radius:18px}.screen{padding:16px}.bar-row{grid-template-columns:minmax(70px,34%) minmax(0,1fr) 80px}}
</style>
<script src="config.js"></script>
</head>

/* ================= 保存先（デモ / Supabase） ================= */
function LocalBackend(){
  const KEY = "kp2_demo_db";
  const db = () => Object.assign({sessions:{}, responses:{}, requests:[]}, load(KEY, {}));
  const put = d => save(KEY, d);
  const ls = new Set(); let bc = null;
  try{ bc = new BroadcastChannel("kenmap-kenshu2"); bc.onmessage = e => ls.forEach(f => f(e.data)); }catch(e){}
  window.addEventListener("storage", e => { if(e.key === KEY) ls.forEach(f => f({code:"*"})); });
  const emit = code => { ls.forEach(f => f({code})); try{ bc && bc.postMessage({code}); }catch(e){} };
  const chk = (d, code, key) => { const s = d.sessions[code]; if(!s || s.key !== key) throw new Error("invalid key"); return s; };
  return {
    name:"demo",
    async createSession(o){ const d = db(); d.sessions[o.code] = {code:o.code, key:o.key, title:o.title, content:o.content, active:null, phase:null, state:"open"}; d.responses[o.code] = []; put(d); emit(o.code); },
    async getSession(code){ const s = db().sessions[code]; if(!s) return null; const {key, ...r} = s; return r; },
    async updateSession(code, key, patch){ const d = db(); Object.assign(chk(d, code, key), patch); put(d); emit(code); },
    async addResponse(r){ const d = db(); const s = d.sessions[r.session]; if(!s || s.state !== "open") throw new Error("closed"); (d.responses[r.session] ||= []).push({question_id:r.qid, phase:r.phase, participant:r.pid, value:r.value, created_at:new Date().toISOString()}); put(d); emit(r.session); },
    async listResponses(code){ return db().responses[code] || []; },
    async clearResponses(code, key){ const d = db(); chk(d, code, key); d.responses[code] = []; put(d); emit(code); },
    async requestFeedback(code, key, payload){ const d = db(); chk(d, code, key); const r = {id:uid(10), session_code:code, payload, status:"waiting", feedback:null, questions:null, created_at:new Date().toISOString(), delivered_at:null}; d.requests.push(r); put(d); return r; },
    async getFeedback(code, key){ const d = db(); chk(d, code, key); return d.requests.filter(r => r.session_code === code).slice(-1)[0] || null; },
    async adminList(){ return db().requests.slice().reverse(); },
    async adminDeliver(adminKey, id, feedback, questions){ const d = db(); const r = d.requests.find(x => x.id === id); if(!r) throw new Error("not found"); Object.assign(r, {feedback, questions, status:"delivered", delivered_at:new Date().toISOString()}); put(d); },
    subscribe(code, fn){ const f = m => { if(m.code === code || m.code === "*") fn(); }; ls.add(f); return () => ls.delete(f); }
  };
}
function SupabaseBackend(sb){
  const rpc = async (fn, args) => { const {data, error} = await sb.rpc(fn, args); if(error) throw error; return data; };
  return {
    name:"supabase",
    createSession:o => rpc("create_session", {p_code:o.code, p_key:o.key, p_title:o.title, p_content:o.content}),
    async getSession(code){ const {data, error} = await sb.from("sessions").select("*").eq("code", code).maybeSingle(); if(error) throw error; return data; },
    async updateSession(code, key, patch){ const cur = await this.getSession(code); const n = Object.assign({}, cur, patch); await rpc("update_session", {p_code:code, p_key:key, p_title:n.title, p_content:n.content, p_active:n.active, p_phase:n.phase, p_state:n.state}); },
    async addResponse(r){ const {error} = await sb.from("responses").insert({session_code:r.session, question_id:r.qid, phase:r.phase, participant:r.pid, value:r.value}); if(error) throw error; },
    async listResponses(code){ const {data, error} = await sb.from("responses").select("question_id,phase,participant,value,created_at").eq("session_code", code).order("id", {ascending:true}).limit(5000); if(error) throw error; return data || []; },
    clearResponses:(code, key) => rpc("clear_responses", {p_code:code, p_key:key}),
    requestFeedback:(code, key, payload) => rpc("request_feedback", {p_code:code, p_key:key, p_payload:payload}),
    async getFeedback(code, key){ const d = await rpc("get_feedback", {p_code:code, p_key:key}); return Array.isArray(d) ? (d[0] || null) : d; },
    adminList:adminKey => rpc("admin_list_requests", {p_admin:adminKey}),
    adminDeliver:(adminKey, id, feedback, questions) => rpc("admin_deliver", {p_admin:adminKey, p_id:id, p_feedback:feedback, p_questions:questions}),
    subscribe(code, fn){ const ch = sb.channel("s-" + code + "-" + uid(4)).on("postgres_changes", {event:"*", schema:"public", table:"sessions", filter:"code=eq." + code}, () => fn()).on("postgres_changes", {event:"INSERT", schema:"public", table:"responses", filter:"session_code=eq." + code}, () => fn()).subscribe(); return () => sb.removeChannel(ch); }
  };
}

const latestPer = rs => { const m = new Map(); rs.forEach(r => m.set(r.participant, r)); return [...m.values()]; };
function aggregate(t, all){
  const rs = all.filter(r => r.question_id === t.id);
  if(t.type === "poll" || t.type === "quiz"){
    const by = ph => { const list = latestPer(rs.filter(r => (r.phase||null) === ph)); const counts = t.options.map(() => 0); list.forEach(r => { const v = r.value && r.value.choice; if(v >= 0 && v < counts.length) counts[v]++; }); return {n:list.length, counts}; };
    return t.type === "quiz" ? {pre:by("pre"), post:by("post")} : by(null);
  }
  if(t.type === "scale"){ const list = latestPer(rs); const counts = [0,0,0,0,0]; let sum = 0; list.forEach(r => { const v = r.value && r.value.score; if(v >= 1 && v <= 5){ counts[v-1]++; sum += v; } }); return {n:list.length, counts, avg:list.length ? sum/list.length : 0}; }
  if(t.type === "wordcloud"){ const m = new Map(); rs.forEach(r => { const w = String(r.value && r.value.text || "").trim(); if(w) m.set(w, (m.get(w)||0) + 1); }); return {n:rs.length, words:[...m.entries()].sort((a,b) => b[1]-a[1])}; }
  return {n:rs.length, posts:rs.map(r => String(r.value && r.value.text || "")).filter(Boolean).reverse()};
}
function aggregateSurvey(fields, all){
  const list = latestPer(all.filter(r => r.question_id === "survey"));
  return {n:list.length, fields:fields.map(fd => {
    const vals = list.map(r => r.value && r.value[fd.id]).filter(v => v !== undefined && v !== null && v !== "");
    if(fd.type === "scale"){ const c = [0,0,0,0,0]; let s = 0; vals.forEach(v => { if(v >= 1 && v <= 5){ c[v-1]++; s += v; } }); return {fd, counts:c, avg:vals.length ? s/vals.length : 0, n:vals.length}; }
    if(fd.type === "single" || fd.type === "multi"){ const c = fd.options.map(() => 0); vals.forEach(v => (Array.isArray(v) ? v : [v]).forEach(i => { if(i >= 0 && i < c.length) c[i]++; })); return {fd, counts:c, n:vals.length}; }
    return {fd, texts:vals.map(String), n:vals.length};
  })};
}
function bars(labels, counts, o){
  o = o || {}; const total = o.total ?? counts.reduce((a,b) => a+b, 0);
  if(!total) return `<div class="empty">まだ回答はありません</div>`;
  return `<div class="bars">${labels.map((l,i) => { const p = Math.round(counts[i]/total*100); return `<div class="bar-row"><div>${esc(l)}${o.correct===i ? ' <span class="tag" style="background:var(--mint-soft);color:#14684F">正解</span>' : ""}</div><div class="bar-track"><div class="bar-fill ${o.correct===i?"correct":""}" style="width:${p}%"></div></div><div class="bar-num">${counts[i]}（${p}%）</div></div>`; }).join("")}</div>`;
}
function resultHTML(t, all, phase){
  const a = aggregate(t, all);
  if(t.type === "poll") return `<p class="muted small" style="margin:0 0 6px">回答 ${a.n}人</p>` + bars(t.options, a.counts);
  if(t.type === "quiz"){ const r = x => x.n ? Math.round(x.counts[t.correct]/x.n*100) : null; const pre = r(a.pre), post = r(a.post); const show = phase === "post" ? a.post : (phase === "pre" ? a.pre : (a.post.n ? a.post : a.pre));
    return `<div class="row" style="gap:28px;margin-bottom:8px"><div><div class="muted small">事前の正答率（${a.pre.n}人）</div><div class="big-num">${pre===null?"—":pre+"%"}</div></div><div><div class="muted small">事後の正答率（${a.post.n}人）</div><div class="big-num" style="color:#E05E3E">${post===null?"—":post+"%"}</div></div></div>` + bars(t.options, show.counts, {correct:t.correct, total:show.n}); }
  if(t.type === "scale") return `<p class="muted small" style="margin:0 0 6px">回答 ${a.n}人・平均 <strong>${a.n ? a.avg.toFixed(1) : "—"}</strong></p>` + bars(["1 できなさそう","2","3","4","5 できそう"], a.counts);
  if(t.type === "wordcloud"){ if(!a.words.length) return `<div class="empty">まだ回答はありません</div>`; const mx = a.words[0][1]; return `<div class="cloud">${a.words.slice(0,60).map(([w,c]) => `<span style="font-size:${15 + Math.round(c/mx*32)}px" title="${c}件">${esc(w)}</span>`).join("")}</div>`; }
  if(!a.posts.length) return `<div class="empty">まだ投稿はありません</div>`;
  return `<p class="muted small" style="margin:0 0 6px">投稿 ${a.n}件</p><div class="posts">${a.posts.map(p => `<div class="post">${esc(p)}</div>`).join("")}</div>`;
}
function surveyResultHTML(fields, all){
  const sa = aggregateSurvey(fields, all);
  if(!fields.length) return `<div class="empty">アンケートはありません</div>`;
  return `<p class="muted small">回答 ${sa.n}人</p>` + sa.fields.map(f => `<div style="margin:14px 0"><div style="font-weight:900;font-size:14.5px">${esc(f.fd.label)}</div>${f.fd.type === "scale" ? `<p class="small muted" style="margin:2px 0 6px">平均 ${f.n ? f.avg.toFixed(1) : "—"}（${f.n}人）</p>` + bars(["1","2","3","4","5"], f.counts) : (f.counts ? bars(f.fd.options, f.counts) : (f.texts.length ? `<div class="posts">${f.texts.map(t => `<div class="post">${esc(t)}</div>`).join("")}</div>` : `<div class="empty">まだ回答はありません</div>`))}</div>`).join("");
}

function summaryText(){
  const L = [];
  H.tools.forEach(t => { const a = aggregate(t, R), b = H.blocks.find(x => x.id === t.blockId); L.push(`■${TOOLS[t.type].n}${b ? `（${b.title}）` : ""}：${t.title}`);
    if(t.type === "poll") t.options.forEach((o,j) => L.push(`  ${o}：${a.counts[j]}人`));
    if(t.type === "quiz"){ const r = x => x.n ? Math.round(x.counts[t.correct]/x.n*100) + "%" : "—"; L.push(`  正解：${t.options[t.correct] || ""}／事前の正答率 ${r(a.pre)}（${a.pre.n}人）→ 事後 ${r(a.post)}（${a.post.n}人）`); }
    if(t.type === "scale") L.push(`  平均 ${a.n ? a.avg.toFixed(1) : "—"}（${a.n}人）分布 1:${a.counts[0]} 2:${a.counts[1]} 3:${a.counts[2]} 4:${a.counts[3]} 5:${a.counts[4]}`);
    if(t.type === "wordcloud") L.push("  " + (a.words.slice(0,30).map(([w,c]) => `${w}(${c})`).join("、") || "回答なし"));
    if(t.type === "qa") (a.posts.length ? a.posts : ["投稿なし"]).forEach(p => L.push("  ・" + p.replace(/\n/g," "))); });
  const sa = aggregateSurvey(H.survey, R); L.push(`■アンケート（回答 ${sa.n}人）`);
  sa.fields.forEach(f => { if(f.fd.type === "scale") L.push(`  ${f.fd.label}：平均 ${f.n ? f.avg.toFixed(1) : "—"}`); else if(f.counts) L.push(`  ${f.fd.label}：` + f.fd.options.map((o,j) => `${o} ${f.counts[j]}`).join("、")); else { L.push(`  ${f.fd.label}`); (f.texts.length ? f.texts : ["回答なし"]).forEach(x => L.push("   ・" + x.replace(/\n/g," "))); } });
  return L.join("\n");
}

  R.forEach(r => { const t = tm[r.question_id]; let ans = "";
    if(r.question_id === "survey") ans = H.survey.map(fd => { const v = r.value[fd.id]; if(v === undefined) return ""; const x = (fd.type === "single" || fd.type === "multi") ? (Array.isArray(v) ? v : [v]).map(i => fd.options[i]).join("/") : v; return `${fd.label}：${x}`; }).filter(Boolean).join(" | ");
    else if(t && (t.type === "poll" || t.type === "quiz")) ans = t.options[r.value.choice] ?? ""; else if(t && t.type === "scale") ans = r.value.score; else ans = r.value.text ?? "";
    rows.push([r.question_id === "survey" ? "アンケート" : (t ? t.title : ""), r.question_id === "survey" ? "アンケート" : (t ? TOOLS[t.type].n : ""), r.phase === "pre" ? "事前" : (r.phase === "post" ? "事後" : ""), r.participant.slice(0,6), ans, r.created_at || ""]); });
  const csv = "﻿" + rows.map(r => r.map(x => `"${String(x ?? "").replace(/"/g,'""')}"`).join(",")).join("\r\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], {type:"text/csv"})); a.download = `${H.plan.title || "研修"}_回答.csv`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1500);
}

/* ================= 運営の受付画面 ================= */
async function renderAdmin(){
  const key = load("kp2_admin", "");
  $app.innerHTML = `<header class="hero"><div class="wrap"><div class="brand">Ken<b>MaP</b><small>運営の受付画面</small></div>${BE.name === "demo" ? `<button class="btn sub sm" id="back-host" style="background:#fff">講師画面にもどる</button>` : ""}</div></header><main><div class="wrap" id="view"></div></main>`;
  const bh = document.getElementById("back-host"); if(bh) bh.onclick = () => { adminMode = false; renderHost(); };
  const v = document.getElementById("view");
  if(BE.name !== "demo" && !key){ v.innerHTML = `<div class="card"><h2>運営用の合言葉</h2><p class="lead">Supabaseの admin_keys に登録した合言葉を入れてください。</p><label class="sr-only" for="ak">合言葉</label><input type="password" id="ak"><div class="row" style="margin-top:12px"><button class="btn" id="ak-ok">ひらく</button></div></div>`; document.getElementById("ak-ok").onclick = () => { save("kp2_admin", document.getElementById("ak").value); renderAdmin(); }; return; }
  let list = []; try{ list = await BE.adminList(key) || []; }catch(e){ v.innerHTML = `<div class="card"><h2>ひらけませんでした</h2><p class="lead">合言葉を確かめてください。</p><button class="btn ghost sm" id="ak-reset">合言葉を入れ直す</button></div>`; document.getElementById("ak-reset").onclick = () => { save("kp2_admin", ""); renderAdmin(); }; return; }
  const waiting = list.filter(r => r.status !== "delivered").length;
  v.innerHTML = `<div class="card"><span class="kicker">運営</span><h1>届いた依頼（未対応 ${waiting}件）</h1><p class="lead">AI用の指示文をコピーして分析の下書きを作り、確認してから「届ける」を押します。目安は依頼から1週間以内です。</p></div>
  ${list.length ? list.map((r,i) => { const due = new Date(new Date(r.created_at).getTime() + 7*864e5); return `<div class="card"><div class="row"><span class="tag ${r.status==="delivered"?"":"live"}">${r.status === "delivered" ? "届けた" : "未対応"}</span><h3 style="margin:0">${esc(r.payload && r.payload.title || "無題の研修")}</h3><span class="spacer"></span><span class="small muted">依頼 ${new Date(r.created_at).toLocaleDateString("ja-JP")}／期限 ${due.getMonth()+1}月${due.getDate()}日</span></div>
    <details style="margin-top:8px"><summary>研修の設計と結果を見る</summary><pre class="copy">${esc((r.payload && r.payload.design || "") + "\n\n" + (r.payload && r.payload.summary || ""))}</pre></details>
    <div class="row" style="margin:10px 0"><button class="btn sub sm" data-cp="${i}">${SVG.copy}AI用の指示文をコピー</button></div>
    <label class="f" for="fb-${i}">フィードバック（良い点・さらに良く・次回すぐ試せること）</label><textarea id="fb-${i}" style="min-height:140px">${esc(r.feedback || "")}</textarea>
    <label class="f" for="q-${i}">講師への問いかけ（発問）</label><textarea id="q-${i}">${esc(r.questions || "")}</textarea>
    <div class="row" style="margin-top:12px"><span class="spacer"></span><button class="btn" data-send="${i}">${r.status === "delivered" ? "内容を更新して届け直す" : "確認したので届ける"}</button></div></div>`; }).join("") : `<div class="card empty">まだ依頼はありません</div>`}`;
  v.querySelectorAll("[data-cp]").forEach(b => b.onclick = () => copyText(list[Number(b.dataset.cp)].payload.prompt || ""));
  v.querySelectorAll("[data-send]").forEach(b => b.onclick = async () => { const i = Number(b.dataset.send), fb = document.getElementById("fb-" + i).value.trim(), q = document.getElementById("q-" + i).value.trim(); if(!fb || !q){ toast("フィードバックと問いかけの両方を書いてください"); return; } try{ await BE.adminDeliver(key, list[i].id, fb, q); toast("届けました"); renderAdmin(); }catch(e){ toast("届けられませんでした"); } });
}

/* ================= 受講者画面 ================= */
const answered = load("kp2_answered", {});
const waitHTML = msg => `<div class="card wait"><div class="bub" aria-hidden="true"><i></i><i></i><i></i></div><div>${msg}</div></div>`;
function renderParticipant(el, s, demo){
  if(!s){ el.innerHTML = `<div class="card empty">研修が見つかりませんでした。参加コードを確かめてください。</div>`; return; }
  const key = s.code + ":" + (s.active || "") + ":" + (s.phase || "");
  if(el.dataset.key === key && el.dataset.title === s.title) return;
  el.dataset.key = key; el.dataset.title = s.title;
  const head = demo ? "" : `<div class="p-top"><div class="small" style="opacity:.85;position:relative">KenMaP 研修・学習会</div><div class="p-title">${esc(s.title)}</div></div>`;
  if(s.state !== "open"){ el.innerHTML = head + `<div class="card empty">この研修の受付は終了しました。</div>`; return; }
  if(!s.active){ el.innerHTML = head + waitHTML("講師が次の問いを開くまで、少しお待ちください"); return; }
  const done = answered[key];
  const warn = `<div class="warn">利用者さんや同僚の名前など、個人が分かることは書かないでください。</div>`;
  const thanks = msg => `<div class="card thanks"><div class="ok">${SVG.check.replace('class="icon"','width="34" height="34" style="color:#fff"')}</div><h3>${msg}</h3></div>`;
  if(s.active === "survey"){
    const fields = (s.content.survey && s.content.survey.fields) || [];
    if(done){ el.innerHTML = head + thanks("アンケートにご協力いただき、ありがとうございました！"); return; }
    el.innerHTML = head + `<form class="card" id="sv"><h3>研修後アンケート</h3><p class="small muted" style="margin-top:0">無記名です。率直な声をお聞かせください。</p>${fields.map((fd,i) => fieldHTML(fd,i)).join("")}${fields.some(f => f.type === "short" || f.type === "long") ? warn : ""}<button class="btn" type="submit" style="width:100%">送信する</button></form>`;
    el.querySelector("#sv").onsubmit = async e => { e.preventDefault(); const val = {};
      fields.forEach(fd => { if(fd.type === "scale" || fd.type === "single"){ const c = el.querySelector(`input[name="f-${fd.id}"]:checked`); if(c) val[fd.id] = Number(c.value); } else if(fd.type === "multi") val[fd.id] = [...el.querySelectorAll(`input[name="f-${fd.id}"]:checked`)].map(c => Number(c.value)); else { const t = el.querySelector(`[name="f-${fd.id}"]`); if(t && t.value.trim()) val[fd.id] = t.value.trim().slice(0,600); } });
      await submit(el, s, "survey", null, val, key, demo); };
    return;
  }
  const q = (s.content.items || []).find(x => x.id === s.active); if(!q){ el.innerHTML = head + waitHTML("講師が次の問いを開くまで、少しお待ちください"); return; }
  const T = TOOLS[q.type], again = q.type === "wordcloud" || q.type === "qa";
  const label = `<div class="row" style="margin-bottom:6px"><span class="tag" style="background:${T.bg}">${T.n}</span>${q.type === "quiz" ? `<span class="tag">${s.phase === "post" ? "事後" : "事前"}チェック</span>` : ""}</div>`;
  if(done && !again){ el.innerHTML = head + `<div class="card thanks"><div class="ok">${SVG.check.replace('class="icon"','width="34" height="34" style="color:#fff"')}</div><h3>回答しました！</h3><p class="small muted">画面に結果が映るのを待ちましょう</p><button class="btn ghost sm" id="redo">回答を変える</button></div>`; el.querySelector("#redo").onclick = () => { delete answered[key]; save("kp2_answered", answered); el.dataset.key = ""; renderParticipant(el, s, demo); }; return; }
  let body = "";
  if(q.type === "poll" || q.type === "quiz") body = q.options.map((o,j) => `<label class="choice"><input type="radio" name="c" value="${j}" required><span>${esc(o)}</span></label>`).join("");
  if(q.type === "scale") body = `<div class="scale" role="radiogroup" aria-label="1から5で選ぶ">${[1,2,3,4,5].map(n => `<label><input type="radio" name="c" value="${n}" required>${n}</label>`).join("")}</div><div class="scale-ends"><span>できなさそう</span><span>できそう</span></div>`;
  if(q.type === "wordcloud") body = `<input type="text" name="t" maxlength="20" required placeholder="一言で（20文字まで）" aria-label="一言">${warn}`;
  if(q.type === "qa") body = `<textarea name="t" maxlength="400" required placeholder="自由に書いてください" aria-label="投稿"></textarea>${warn}`;
  el.innerHTML = head + `<form class="card" id="qf">${label}<h3 style="font-size:19px">${esc(q.title)}</h3>${body}${done && again ? '<p class="small" style="color:#14684F;font-weight:700">送信しました。何度でも送れます。</p>' : ""}<button class="btn" type="submit" style="width:100%;margin-top:10px">送信する</button></form>`;
  el.querySelector("#qf").onsubmit = async e => { e.preventDefault(); const f = e.target; let val;
    if(q.type === "poll" || q.type === "quiz") val = {choice:Number(f.c.value)}; else if(q.type === "scale") val = {score:Number(f.c.value)}; else val = {text:f.t.value.trim().slice(0, q.type === "wordcloud" ? 20 : 400)};
    await submit(el, s, q.id, q.type === "quiz" ? (s.phase || "pre") : null, val, key, demo); };
}
function fieldHTML(fd, i){ const n = `f-${fd.id}`; let inner = "";
  if(fd.type === "scale") inner = `<div class="scale">${[1,2,3,4,5].map(v => `<label><input type="radio" name="${n}" value="${v}">${v}</label>`).join("")}</div><div class="scale-ends"><span>そう思わない</span><span>そう思う</span></div>`;
  if(fd.type === "single") inner = fd.options.map((o,j) => `<label class="choice"><input type="radio" name="${n}" value="${j}"><span>${esc(o)}</span></label>`).join("");
  if(fd.type === "multi") inner = fd.options.map((o,j) => `<label class="choice"><input type="checkbox" name="${n}" value="${j}"><span>${esc(o)}</span></label>`).join("");
  if(fd.type === "short") inner = `<input type="text" name="${n}" maxlength="100" aria-label="${esc(fd.label)}">`;
  if(fd.type === "long") inner = `<textarea name="${n}" maxlength="600" aria-label="${esc(fd.label)}"></textarea>`;
  return `<fieldset><legend>${i+1}. ${esc(fd.label)}</legend>${inner}</fieldset>`; }
async function submit(el, s, qid, phase, value, key, demo){
  const btn = el.querySelector("button[type=submit]"); if(btn) btn.disabled = true;
  try{ await BE.addResponse({session:s.code, qid, phase, pid:PID, value}); answered[key] = true; save("kp2_answered", answered); toast("送信しました"); el.dataset.key = ""; renderParticipant(el, s, demo); }
  catch(e){ toast("送信できませんでした。もう一度お試しください"); if(btn) btn.disabled = false; }
}
async function startParticipant(code){
  $app.innerHTML = `<div class="participant" id="p"></div>`; const el = document.getElementById("p");
  const draw = async () => { try{ renderParticipant(el, await BE.getSession(code), false); }catch(e){ el.innerHTML = `<div class="card empty">接続できませんでした。電波の良い場所で、ページを開き直してください。</div>`; } };
  BE.subscribe(code, draw); await draw();
}

/* ================= 投影画面 ================= */
async function startScreen(code){
  const draw = async () => {
    let s, rs; try{ s = await BE.getSession(code); rs = await BE.listResponses(code); }catch(e){ $app.innerHTML = `<div class="screen"><div class="empty">接続できませんでした</div></div>`; return; }
    if(!s){ $app.innerHTML = `<div class="screen"><div class="empty">研修が見つかりませんでした</div></div>`; return; }
    const join = `<div class="screen-join">${qrSVG(joinURL(code), 3)}<div><div class="small muted">スマホで参加</div><div class="code">${esc(code)}</div></div></div>`;
    let body = `<div class="wait" style="font-size:24px"><div class="bub" aria-hidden="true"><i></i><i></i><i></i></div><div>QRコードを読み込んで、お待ちください</div></div>`;
    if(s.active === "survey"){ const n = latestPer(rs.filter(r => r.question_id === "survey")).length; body = `<div class="screen-q">研修後アンケートにご協力ください</div><div class="big-num" style="font-size:56px">${n}人が回答</div>`; }
    else if(s.active){ const q = (s.content.items || []).find(x => x.id === s.active); if(q) body = `<div class="screen-q">${esc(q.title)}</div><div>${resultHTML(q, rs, s.phase)}</div>`; }
    $app.innerHTML = `<div class="screen"><div class="screen-head"><div class="screen-title">${esc(s.title)}</div>${join}</div>${body}</div>`;
  };
  BE.subscribe(code, draw); await draw();
}

/* ================= 起動 ================= */
(async () => {
  if(CFG.supabaseUrl && CFG.supabaseAnonKey){ const ok = await loadScript("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"); if(ok && window.supabase) BE = SupabaseBackend(window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey)); }
  if(!BE) BE = LocalBackend();
  const join = params.get("join"), screen = params.get("screen");
  if(join) return startParticipant(join.toUpperCase());
  if(screen) return startScreen(screen.toUpperCase());
  if(params.has("admin")) adminMode = true;
  renderHost();
})();
}
